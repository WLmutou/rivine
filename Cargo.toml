[package]
name = "rivine"
version = "0.2.0"
edition = "2024"
description = "Apache Kafka® rewritten in Rust — a Kafka-compatible broker from scratch"
license = "MIT"
readme = "README.md"
repository = "https://github.com/WLmutou/rivine"
homepage = "https://github.com/WLmutou/rivine"
documentation = "https://docs.rs/rivine"
keywords = ["kafka", "broker", "messaging", "protocol", "event-streaming"]
categories = ["database", "network-programming", "web-programming", "concurrency", "command-line-utilities"]

[[bin]]
name = "rivine-broker"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
bytes = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Config
config = { version = "0.14", features = ["toml"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"

# Compression (Kafka: gzip/snappy/lz4/zstd)
flate2 = "1"
snap = "1"
lz4_flex = { version = "0.11", features = ["frame"] }
zstd = "0.13"

# CRC（Kafka RecordBatch 使用 CRC32C/Castagnoli）
crc32c = "0.6"

# Concurrency
dashmap = "6"
arc-swap = "1"

# Async stream utilities (Raft driver election)
futures-util = "0.3"

# Metrics
prometheus = "0.13"

# Raft consensus (KRaft)
# We implement custom Raft per the doc for learning purposes; raft crate is optional.
